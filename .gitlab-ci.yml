stages:
  - build

sem_telegram_bot_production_build:
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  stage: build
  script:
    - cd bot
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t registry.gitlab.com/nikitamelnikwork/sem:bot .
    - docker push registry.gitlab.com/nikitamelnikwork/sem:bot
  only:
    - "#15"
